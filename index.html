<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
    <meta name="description" content="An application built with Google AI Studio." />
    <meta property="og:title" content="My Google AI Studio App" />
    <meta property="og:description" content="An application built with Google AI Studio." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      function showErr(m){document.body.innerHTML='<pre style="padding:16px;white-space:pre-wrap;font-size:14px;color:#b00">'+m+'</pre>'}
      window.addEventListener('error',function(e){showErr('ERROR: '+e.message+'\n'+(e.filename||'')+':'+(e.lineno||''))});
      window.addEventListener('unhandledrejection',function(e){showErr('PROMISE ERROR: '+(e.reason&&e.reason.stack||e.reason))});
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
